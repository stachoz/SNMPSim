devices:
  - name: "PC-1"
    ip: "172.17.0.3"
    params:
      - name: "temperature"
        oid: "1.3.6.1.2025.1"
        error_range:
            greater_than: 70
            less_than: 10

  - name: "PC-2"
    ip: "172.17.0.4"
    params:
      - name: "cpuUsage"
        oid: "1.3.6.1.2025.2"
        error_range:
            greater_than: 80

  - name: "PC-3"
    ip: "172.17.0.4"
    params:
      - name: "cpuUsage"
        oid: "1.3.6.1.2025.2"
        error_range:
          greater_than: 80

  - name: "server"
    ip: "172.17.0.5"
    params:
      - name: "cpu-temperature"
        oid: "1.3.6.1.2025.1"
        error_range:
            greater_than: 70
            less_than: 10
      - name: "cpu-usage"
        oid: "1.3.6.1.2025.2"
        error_range:
            greater_than: 80
      - name: "processes"
        oid: "1.3.6.1.2025.3"
        error_range:
            less_than: 1
      - name: "memory-usage"
        oid: "1.3.6.1.2025.4"
        error_range:
            greater_than: 90
      - name: "eth0-status"
        oid: "1.3.6.1.2025.5"
        error_range:
            less_than: 1

  - name: "server-2"
    ip: "172.17.0.6"
    params:
      - name: "cpu-temperature"
        oid: "1.3.6.1.2025.1"
        error_range:
          greater_than: 70
          less_than: 10
      - name: "cpu-usage"
        oid: "1.3.6.1.2025.2"
        error_range:
          greater_than: 80
      - name: "processes"
        oid: "1.3.6.1.2025.3"
        error_range:
          less_than: 1
      - name: "memory-usage"
        oid: "1.3.6.1.2025.4"
        error_range:
          greater_than: 90
      - name: "eth0-status"
        oid: "1.3.6.1.2025.5"
        error_range:
          less_than: 1
